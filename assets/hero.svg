<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Adrian Ademovic — autonomous systems, LLM pipelines, risk-gated execution">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0C10"/>
      <stop offset="55%" stop-color="#0D1015"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#F2A93B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1B222C" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="1035.9" y1="69.6" x2="1078" y2="160">
      <stop offset="0%" stop-color="#F2A93B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F2A93B" stop-opacity="0.42"/>
    </linearGradient>
    <clipPath id="radarClip"><circle cx="960" cy="160" r="118"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#fade)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#F2A93B" opacity="0.35"/>

  <!-- radar -->
  <g clip-path="url(#radarClip)">
    <circle cx="960" cy="160" r="118" fill="#0C1015"/>
    <g stroke="#232B36" fill="none">
      <circle cx="960" cy="160" r="40"/><circle cx="960" cy="160" r="78"/><circle cx="960" cy="160" r="116"/>
      <path d="M842 160 H1078 M960 42 V278"/>
      <path d="M877 77 L1043 243 M1043 77 L877 243" stroke-opacity="0.5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 960 160" to="360 960 160" dur="4.5s" repeatCount="indefinite"/>
      <path d="M960 160 L1035.9 69.6 A118 118 0 0 1 1078 160 Z" fill="url(#sweep)"/>
      <path d="M960 160 L1078 160" stroke="#F2A93B" stroke-width="1.5" stroke-opacity="0.85"/>
    </g>
    <g fill="#F2A93B">
      <circle cx="1012" cy="118" r="3.5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.35;0.7" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="906" cy="214" r="3.5"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.8;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="994" cy="216" r="2.5" fill="#35D0A5"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.6;0.9" dur="4s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <circle cx="960" cy="160" r="118" fill="none" stroke="#2C3542" stroke-width="1"/>

  <!-- text -->
  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace">
    <text x="80" y="96" fill="#7D8896" font-size="13" letter-spacing="4">CS @ TU DARMSTADT &#183; FRANKFURT, DE</text>
    <text x="80" y="160" fill="#E8EDF4" font-size="46" font-weight="700" letter-spacing="2">ADRIAN ADEMOVIC</text>
    <rect x="80" y="178" width="0" height="2" fill="#F2A93B">
      <animate attributeName="width" from="0" to="452" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <text x="80" y="216" fill="#9AA5B2" font-size="16">Autonomous systems &#183; LLM pipelines &#183; risk-gated execution</text>
    <g font-size="12" letter-spacing="1.5" fill="#7D8896">
      <rect x="80"  y="240" width="126" height="26" rx="3" fill="#12171E" stroke="#232B36"/><text x="94"  y="257">PYTHON</text>
      <rect x="216" y="240" width="150" height="26" rx="3" fill="#12171E" stroke="#232B36"/><text x="230" y="257">TYPESCRIPT</text>
      <rect x="376" y="240" width="182" height="26" rx="3" fill="#12171E" stroke="#232B36"/><text x="390" y="257">LLM SYSTEMS</text>
    </g>
  </g>
</svg>
